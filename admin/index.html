<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>BODA Admin</title>
<link rel="icon" href="../favicon-32.png" />
<!--
  BODA admin dashboard.

  A plain static page. It talks to Supabase directly from the browser using the
  PUBLIC anon key — the same key that ships inside the mobile app — and every
  request is authorised by the signed-in user's own session. There is no secret
  in this file and there must never be one: the service-role key would let
  anyone reading the page source do anything to the database.

  What actually protects the data is server-side: row-level security only lets a
  profile flagged is_admin read other users' submissions or write content, and a
  database trigger re-checks the exercise integrity rules on every write. This
  page cannot bypass either, which is why it is safe for it to be public.
-->
<style>
  :root{
    --navy:#000031; --coral:#FF6F63; --cream:#FEFEF2; --white:#fff;
    --ink:#000031; --muted:rgba(0,0,49,.55); --faint:rgba(0,0,49,.38);
    --line:rgba(0,0,49,.10); --good:#2E9E5B; --warn:#E2A03F; --bad:#D2492A;
    --radius:14px; --shadow:0 4px 14px rgba(0,0,49,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  a{color:var(--navy)}

  /* ── Login ─────────────────────────────────────────────── */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow);
    padding:32px;width:100%;max-width:380px}
  .brand{font-weight:800;letter-spacing:-.5px;font-size:26px;margin:0 0 4px}
  .brand span{color:var(--coral)}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:var(--cream)}
  .btn{border:1px solid transparent;border-radius:11px;padding:11px 16px;font-weight:600;
    background:var(--white);color:var(--ink);border-color:var(--line)}
  .btn:hover{filter:brightness(.98)}
  .btn.primary{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}
  .btn.danger{color:var(--bad);border-color:rgba(210,73,42,.35)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.block{width:100%}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

  /* ── Shell ─────────────────────────────────────────────── */
  .shell{display:none;min-height:100vh;grid-template-columns:212px 1fr}
  .side{background:var(--navy);color:var(--cream);padding:22px 14px;display:flex;
    flex-direction:column;gap:4px}
  .side .brand{color:var(--cream);font-size:20px;padding:0 10px 14px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{background:transparent;border:0;color:rgba(254,254,242,.72);
    text-align:left;padding:10px 12px;border-radius:9px;font-weight:600;font-size:14px}
  .nav button:hover{background:rgba(254,254,242,.08);color:var(--cream)}
  .nav button.on{background:rgba(254,254,242,.15);color:var(--cream)}
  .navgroup{display:flex;flex-direction:column;gap:2px;margin-top:9px}
  .grouphead{display:flex!important;align-items:center;gap:6px;background:transparent;border:0;
    color:rgba(254,254,242,.45);text-align:left;padding:5px 12px;cursor:pointer;
    font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
  .grouphead:hover{background:transparent;color:rgba(254,254,242,.8)}
  .grouphead .caret{font-size:8px;transition:transform .15s;opacity:.8}
  .grouphead .gcount{margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;
    font-size:10px;font-weight:700;padding:1px 6px;letter-spacing:0}
  .navgroup.closed .caret{transform:rotate(-90deg)}
  .navgroup.closed .groupitems{display:none}
  .groupitems{display:flex;flex-direction:column;gap:2px}
  .groupitems button{padding-left:22px;font-size:13.5px}
  .nav .count{float:right;background:var(--coral);color:#fff;border-radius:999px;
    padding:1px 7px;font-size:11px;font-weight:700}
  .side-foot{margin-top:auto;padding:0 10px;font-size:12px;color:rgba(254,254,242,.5)}
  .side-foot button{color:rgba(254,254,242,.75);background:none;border:0;padding:6px 0;
    font-size:12.5px;text-decoration:underline}

  main{padding:26px 30px 60px;overflow:auto;max-height:100vh}
  h1{font-size:23px;margin:0 0 3px}
  .lede{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:220px;padding:9px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--white)}
  .chip{border:1px solid var(--line);background:var(--white);border-radius:999px;
    padding:6px 12px;font-size:13px;font-weight:600}
  .chip.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}

  .card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:12px}
  .row{display:flex;gap:14px;align-items:flex-start}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .tiny{font-size:11.5px}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;
    font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .pill.pending{background:rgba(226,160,63,.16);color:var(--warn)}
  .pill.approved{background:rgba(46,158,91,.14);color:var(--good)}
  .pill.rejected,.pill.failed{background:rgba(210,73,42,.13);color:var(--bad)}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .stat b{display:block;font-size:26px;line-height:1.15}
  .stat span{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--faint);
    text-transform:uppercase}
  table{width:100%;border-collapse:collapse;background:var(--white);
    border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint)}
  tr:last-child td{border-bottom:0}
  tr.clickable:hover{background:rgba(0,0,49,.03);cursor:pointer}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .note-form textarea{width:100%;padding:11px 13px;border:1px solid var(--line);
    border-radius:11px;background:var(--white);min-height:84px;resize:vertical}
  .note-form label{display:block;font-size:12px;font-weight:600;margin:0 0 5px}
  .note-form .when{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
  .note-form .when>div{flex:1;min-width:150px}
  .note-form input[type=date]{width:100%;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--white)}
  .note-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;
    border-top:1px solid var(--line)}
  .note-row:first-child{border-top:0}
  .note-row .body{flex:1;min-width:0}
  .pill.live{background:rgba(46,158,91,.14);color:var(--good)}
  .pill.scheduled{background:rgba(226,160,63,.16);color:var(--warn)}
  .pill.done{background:rgba(0,0,49,.07);color:var(--muted)}
  /* Sheet tables (recipes / exercises) */
  .sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--white)}
  table.sheet{width:100%;border-collapse:collapse;font-size:13px;min-width:840px}
  table.sheet thead th{position:sticky;top:0;background:#F7F7EE;z-index:1;text-align:left;
    font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
    padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.sheet td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.sheet tbody tr:hover{background:rgba(0,0,49,.03);cursor:pointer}
  table.sheet td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.sheet td.nm{font-weight:600;max-width:280px}
  .thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#EFEFE3;display:block}
  .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
  .tagline{display:flex;gap:4px;flex-wrap:wrap}
  .tg{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(0,0,49,.06);color:var(--muted);white-space:nowrap}
  .sheet-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .sheet-bar input[type=search]{flex:1;min-width:200px}
  .rowcount{font-size:12px;color:var(--muted);margin:10px 2px 0}
  /* Editor bits */
  .imgbox{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .imgbox .prev{width:82px;height:82px;border-radius:12px;object-fit:cover;background:#EFEFE3;
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center}
  .ing-row{display:grid;grid-template-columns:58px 70px 1fr 128px 24px;gap:6px;align-items:start;margin-bottom:7px}
  .ing-row input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;background:var(--white)}
  .ing-name-wrap{position:relative}
  .ac{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 10px 24px rgba(0,0,49,.16);z-index:30;max-height:240px;overflow:auto}
  .ac div{padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line)}
  .ac div:last-child{border-bottom:0}
  .ac div:hover{background:rgba(0,0,49,.05)}
  .ac .u{color:var(--muted);font-size:11px;display:block}
  .matched{font-size:10.5px;color:var(--good);margin-top:3px}
  .xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:6px 0}
  .sub-day{font-size:12.5px;margin:3px 0}
  .sub-note{background:rgba(0,0,49,.04);border-radius:11px;padding:10px 13px;margin:8px 0;font-size:13px}
  .sub-fb{background:rgba(46,158,91,.08);border-radius:11px;padding:10px 13px;margin:8px 0;font-size:13px}
  textarea.fb{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--white);min-height:64px;resize:vertical;margin:8px 0}
  .spinner{padding:34px;text-align:center;color:var(--muted)}

  /* ── Editor drawer ─────────────────────────────────────── */
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,49,.35);display:none;z-index:20}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--cream);
    box-shadow:-8px 0 30px rgba(0,0,49,.18);padding:24px;overflow:auto;display:none;z-index:21}
  .drawer h2{margin:0 0 4px;font-size:19px}
  .drawer .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--white);min-height:96px;resize:vertical}
  .drawer .field input{background:var(--white)}
  .locked{background:rgba(0,0,49,.045);border-radius:11px;padding:12px;font-size:12.5px;
    color:var(--muted);margin:14px 0}
  .problems{color:var(--bad);font-size:12.5px;margin:10px 0}
  .ing{font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--line)}
  .ing.miss{color:var(--faint)}
  .urow{display:grid;grid-template-columns:1fr 190px 62px 62px;gap:12px;align-items:center;
    padding:9px 12px;border-bottom:1px solid var(--line)}
  .urow:last-child{border-bottom:0}
  .ubar{background:rgba(0,0,49,.07);border-radius:999px;height:9px;overflow:hidden}
  .ubar i{display:block;height:100%;background:var(--coral);border-radius:999px}
  .unum{text-align:right;font-weight:700;font-size:14px}
  .uhead{display:grid;grid-template-columns:1fr 190px 62px 62px;gap:12px;padding:0 12px 6px;
    font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint)}
  .uhead span:nth-child(3),.uhead span:nth-child(4){text-align:right}
  .uarea{font-size:11px;color:var(--faint);margin-left:7px}
  .unused{opacity:.5}
  .picker{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .pick{border:1px solid var(--line);background:var(--white);border-radius:999px;
    padding:5px 11px;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .pick i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
  .pick.on{border-color:var(--navy);font-weight:600}
  .chart{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:12px}
  .chart svg{width:100%;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:11px;height:3px;border-radius:2px;display:inline-block}
  @media (max-width:820px){ .shell{grid-template-columns:1fr} .side{flex-direction:row;
    overflow:auto;align-items:center} .nav{flex-direction:row} .side .brand{display:none}
    .side-foot{margin:0}
    .navgroup{display:contents} .grouphead{display:none!important}
    .navgroup .groupitems, .navgroup.closed .groupitems{display:contents} }
</style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────── -->
<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <p class="brand">BO<span>DA</span> Admin</p>
    <p class="sub">Sign in with your BODA account. Admin access only.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
    </div>
    <button class="btn primary block" id="loginBtn" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- ── Dashboard ─────────────────────────────────────────── -->
<div class="shell" id="shell">
  <aside class="side">
    <p class="brand">BO<span style="color:var(--coral)">DA</span></p>
    <nav class="nav" id="nav">
      <button data-view="overview" class="on">Overview</button>

      <div class="navgroup" data-group="food">
        <button class="grouphead" data-toggle="food">
          <span class="caret">&#9660;</span> Food <span class="gcount" id="gFood" hidden></span>
        </button>
        <div class="groupitems">
          <button data-view="catalog">Recipes</button>
          <button data-view="recipes">Imports <span class="count" id="cRecipes" hidden></span></button>
        </div>
      </div>

      <div class="navgroup" data-group="training">
        <button class="grouphead" data-toggle="training">
          <span class="caret">&#9660;</span> Training <span class="gcount" id="gTraining" hidden></span>
        </button>
        <div class="groupitems">
          <button data-view="exercises">Exercises</button>
          <button data-view="workouts">Workouts</button>
          <button data-view="splitreviews">Split reviews <span class="count" id="cSubs" hidden></span></button>
        </div>
      </div>

      <div class="navgroup" data-group="app">
        <button class="grouphead" data-toggle="app">
          <span class="caret">&#9660;</span> App
        </button>
        <div class="groupitems">
          <button data-view="dailynote">Daily note</button>
        </div>
      </div>

      <div class="navgroup" data-group="ops">
        <button class="grouphead" data-toggle="ops">
          <span class="caret">&#9660;</span> Operations
        </button>
        <div class="groupitems">
          <button data-view="usage">Usage</button>
          <button data-view="admins">Admins</button>
        </div>
      </div>
    </nav>
    <div class="side-foot">
      <div id="whoami"></div>
      <button id="signOut">Sign out</button>
    </div>
  </aside>
  <main id="main"><div class="spinner">Loading…</div></main>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer"></aside>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Public anon key — the same one inside the mobile app. Safe here: it grants
// nothing on its own, and row-level security decides what the signed-in user
// may see or change.
const SUPABASE_URL = 'https://blrbirygfkflyehjupry.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJscmJpcnlnZmtmbHllaGp1cHJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjM0OTIsImV4cCI6MjA5Mzc5OTQ5Mn0.7Un2ofLMs3BbNm9HRo5cnaAj0iAjH6pp1G4VBBmh2Gc';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const main = $('main');

let state = { view: 'overview', recipes: [], catalog: [], exercises: [], workouts: [],
              admins: [], notes: [], subs: [], user: null };

// Vocabularies read off the live table (2026-09-01) rather than guessed, so the
// editor can only produce values the app already understands.
const MEAL_TYPES = ['breakfast', 'lunch', 'dinner', 'snack'];
const DIET_TAGS  = ['vegan', 'vegetarian', 'pescatarian', 'gluten-free', 'dairy-free', 'nut-free'];
const CUISINES   = ['american', 'indian', 'italian', 'japanese', 'mediterranean', 'mexican',
                    'middle-eastern', 'thai'];

// ── Auth ────────────────────────────────────────────────────
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value,
  });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = error.message; return; }
  await start();
});

$('signOut').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function start() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  // Admin is checked on the SERVER too — this only decides what to show.
  const { data: prof } = await sb.from('profiles')
    .select('is_admin, first_name').eq('user_id', user.id).maybeSingle();

  if (!prof?.is_admin) {
    $('loginErr').textContent =
      'That account is not an admin. Ask Charlie to enable it.';
    await sb.auth.signOut();
    return;
  }

  state.user = user;
  $('whoami').textContent = prof.first_name ? `${prof.first_name} · admin` : 'admin';
  $('login').style.display = 'none';
  $('shell').style.display = 'grid';
  render();
  loadAll();
}

// ── Nav ─────────────────────────────────────────────────────
$('nav').addEventListener('click', e => {
  // Group headers collapse their section; they carry no data-view.
  const head = e.target.closest('button[data-toggle]');
  if (head) { head.closest('.navgroup').classList.toggle('closed'); return; }

  const btn = e.target.closest('button[data-view]');
  if (!btn) return;
  state.view = btn.dataset.view;
  // querySelectorAll, not children — the view buttons live inside groups now.
  $('nav').querySelectorAll('button[data-view]').forEach(b => b.classList.toggle('on', b === btn));
  render();
});

// A collapsed group still has to show there is work waiting inside it, so each
// header carries the sum of its children's pending badges.
function groupBadges() {
  const sum = ids => ids.reduce((n, id) => {
    const el = $(id);
    return n + (el && !el.hidden ? Number(el.textContent) || 0 : 0);
  }, 0);
  const set = (id, n) => {
    const el = $(id);
    if (!el) return;
    el.hidden = n === 0;
    el.textContent = n;
  };
  set('gFood', sum(['cRecipes']));
  set('gTraining', sum(['cSubs']));
}

// ── Data ────────────────────────────────────────────────────
async function loadAll() {
  const [recipes, exercises, workouts, subsQ, catalogQ] = await Promise.all([
    sb.from('social_recipes').select('*').order('created_at', { ascending: false }).limit(300),
    sb.from('exercises').select('*').order('name'),
    sb.from('workouts').select('*').order('level').limit(500),
    sb.from('workout_submissions').select('*').order('created_at', { ascending: false }).limit(200),
    sb.from('recipes').select('*').order('name').limit(2000),
  ]);
  state.recipes = recipes.data ?? [];
  state.exercises = exercises.data ?? [];
  state.workouts = workouts.data ?? [];
  state.subs = subsQ.data ?? [];
  state.catalog = catalogQ.data ?? [];

  const pending = state.recipes.filter(r => r.status === 'pending').length;
  const badge = $('cRecipes');
  badge.hidden = pending === 0;

  groupBadges();
  render();
}

// ── Usage ───────────────────────────────────────────────────
// Everything here is an AGGREGATE. Knowing barcode scanning is popular does
// not require reading what anyone scanned, and an analytics screen that hands
// an admin raw personal health data is the wrong trade in an app holding
// blood tests. The server functions only ever return counts.
let usageDays = 30;
let trendBucket = 'week';
let trendMetric = 'users';          // 'users' | 'events'
let trendPicked = null;             // null = auto-pick the most-used features
let trendRows = [];

const SERIES_COLORS = ['#FF6F63','#000031','#2E9E5B','#4A9FE8','#E2A03F','#8E5BD9','#D2492A','#0FA3A3'];

async function viewUsage() {
  main.innerHTML = `
    <h1>Usage</h1>
    <p class="lede">What people actually use, and how that is moving. Counts only — no one's
      individual logs, chats or measurements are shown here.</p>
    <div class="toolbar">
      ${[[7,'7 days'],[30,'30 days'],[90,'90 days'],[365,'1 year'],[3650,'All time']]
        .map(([d,l]) => `<button class="chip ${d===usageDays?'on':''}" data-d="${d}">${l}</button>`).join('')}
    </div>
    <div id="usageBody"><div class="spinner">Loading…</div></div>`;
  main.querySelectorAll('[data-d]').forEach(b =>
    b.onclick = () => { usageDays = Number(b.dataset.d); viewUsage(); });

  const [usage, stats] = await Promise.all([
    sb.rpc('admin_feature_usage', { p_days: usageDays }),
    sb.rpc('admin_overview_stats', { p_days: usageDays }),
  ]);
  const box = $('usageBody');
  if (!box) return;
  if (usage.error) { box.innerHTML = `<div class="empty">${esc(usage.error.message)}</div>`; return; }

  const rows = usage.data ?? [];
  const st = (stats.data ?? [])[0] ?? {};
  const maxUsers = Math.max(1, ...rows.map(r => Number(r.users)));
  const used = rows.filter(r => Number(r.events) > 0);
  const unused = rows.filter(r => Number(r.events) === 0);

  // Default the chart to the five features most people use, so it says something
  // useful before anyone touches a control.
  if (trendPicked === null) trendPicked = used.slice(0, 5).map(r => r.feature);

  box.innerHTML = `
    <div class="stats" style="margin-bottom:18px">
      ${stat(st.total_users ?? 0, 'Total users')}
      ${stat(st.new_users ?? 0, 'New this period')}
      ${stat(st.active_users ?? 0, 'Logged something')}
      ${stat(st.onboarded_users ?? 0, 'Finished setup')}
    </div>

    <div class="toolbar" style="margin-bottom:6px">
      ${['day','week','month'].map(b =>
        `<button class="chip ${b===trendBucket?'on':''}" data-b="${b}">By ${b}</button>`).join('')}
      <span style="flex:1"></span>
      ${['users','events'].map(m =>
        `<button class="chip ${m===trendMetric?'on':''}" data-m="${m}">${m==='users'?'People':'Uses'}</button>`).join('')}
      <button class="btn sm" id="csvBtn">Export CSV</button>
    </div>
    <div class="picker" id="picker">
      ${rows.map(r => `<button class="pick ${trendPicked.includes(r.feature)?'on':''}"
        data-p="${esc(r.feature)}"><i style="background:${trendPicked.includes(r.feature)
          ? SERIES_COLORS[trendPicked.indexOf(r.feature) % SERIES_COLORS.length] : ''}"></i>${esc(r.feature)}</button>`).join('')}
    </div>
    <div id="chart" class="chart"><div class="spinner">Loading trend…</div></div>

    <div class="card" style="padding:14px 4px">
      <div class="uhead"><span>Feature</span><span>People using it</span><span>People</span><span>Uses</span></div>
      ${used.map(r => urow(r, maxUsers)).join('') || '<div class="empty">No activity in this window.</div>'}
    </div>
    ${unused.length ? `
      <p class="small muted" style="margin:16px 0 6px"><b>Not used at all in this window</b> —
        either nobody has tried it yet, or something is broken.</p>
      <div class="card" style="padding:14px 4px">${unused.map(r => urow(r, maxUsers)).join('')}</div>` : ''}
    <p class="tiny muted" style="margin-top:14px">
      Ranked by how many <b>people</b> use it, not raw event count — one very keen user can log a
      thousand meals without that meaning the feature matters to anyone else.
    </p>`;

  box.querySelectorAll('[data-b]').forEach(b =>
    b.onclick = () => { trendBucket = b.dataset.b; viewUsage(); });
  box.querySelectorAll('[data-m]').forEach(b =>
    b.onclick = () => { trendMetric = b.dataset.m; viewUsage(); });
  box.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const f = b.dataset.p;
    trendPicked = trendPicked.includes(f)
      ? trendPicked.filter(x => x !== f)
      : [...trendPicked, f].slice(0, 8);       // eight colours, eight lines
    viewUsage();
  });
  $('csvBtn').onclick = exportCsv;

  await loadTrend();
}

async function loadTrend() {
  const el = $('chart');
  if (!el) return;
  if (trendPicked.length === 0) {
    trendRows = [];
    el.innerHTML = '<div class="empty">Pick a feature above to chart it.</div>';
    return;
  }
  const { data, error } = await sb.rpc('admin_feature_trend', {
    p_days: usageDays, p_bucket: trendBucket, p_features: trendPicked,
  });
  if (error) { el.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  trendRows = data ?? [];
  drawChart(el);
}

function drawChart(el) {
  const metric = trendMetric;
  const buckets = [...new Set(trendRows.map(r => r.bucket))].sort();
  if (buckets.length === 0) { el.innerHTML = '<div class="empty">Nothing in this window.</div>'; return; }

  const series = trendPicked.map((f, i) => ({
    name: f,
    color: SERIES_COLORS[i % SERIES_COLORS.length],
    points: buckets.map(b => {
      const hit = trendRows.find(r => r.bucket === b && r.feature === f);
      return hit ? Number(hit[metric]) : 0;
    }),
  })).filter(s => s.points.some(v => v > 0));

  const W = 900, H = 300, PL = 42, PR = 14, PT = 14, PB = 34;
  const max = Math.max(1, ...series.flatMap(s => s.points));
  const x = i => PL + (buckets.length === 1
    ? (W - PL - PR) / 2
    : (i * (W - PL - PR)) / (buckets.length - 1));
  const y = v => PT + (H - PT - PB) * (1 - v / max);

  // Gridlines carry real values, so the shape can be read as numbers.
  const ticks = 4;
  const grid = Array.from({ length: ticks + 1 }, (_, i) => {
    const v = Math.round((max / ticks) * i);
    return `<line x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}" stroke="rgba(0,0,49,.08)"/>
            <text x="${PL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11"
                  fill="rgba(0,0,49,.38)">${v}</text>`;
  }).join('');

  const labelEvery = Math.ceil(buckets.length / 8);
  const xlabels = buckets.map((b, i) => i % labelEvery === 0
    ? `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="11"
             fill="rgba(0,0,49,.38)">${fmtBucket(b)}</text>` : '').join('');

  const paths = series.map(s => {
    const d = s.points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const dots = s.points.map((v, i) =>
      `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${s.color}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"
                  stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="${esc(metric === 'users' ? 'People using each feature' : 'Uses of each feature')} over time">
      ${grid}${paths}${xlabels}
    </svg>
    <div class="legend">${series.map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>
    <p class="tiny muted" style="margin:8px 0 0">
      ${metric === 'users' ? 'Distinct people' : 'Total uses'} per ${trendBucket}.
    </p>`;
}

function fmtBucket(b) {
  const d = new Date(b + 'T00:00:00');
  if (trendBucket === 'month') return d.toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

// Export exactly what is on screen — same window, bucket and features — so the
// spreadsheet and the chart can never disagree with each other.
function exportCsv() {
  if (trendRows.length === 0) return;
  const head = ['period', 'feature', 'area', 'people', 'uses'];
  const cell = v => /[",\n]/.test(String(v))
    ? '"' + String(v).replace(/"/g, '""') + '"'
    : String(v);
  const lines = [head.join(',')].concat(
    trendRows.map(r => [r.bucket, r.feature, r.area, r.users, r.events].map(cell).join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `boda-usage-${trendBucket}-${usageDays}d-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function urow(r, maxUsers) {
  const users = Number(r.users), events = Number(r.events);
  const pct = Math.round((users / maxUsers) * 100);
  return `<div class="urow ${events === 0 ? 'unused' : ''}">
    <div><b>${esc(r.feature)}</b><span class="uarea">${esc(r.area)}</span></div>
    <div class="ubar"><i style="width:${pct}%"></i></div>
    <div class="unum">${users}</div>
    <div class="unum">${events}</div>
  </div>`;
}

// -- Daily note ----------------------------------------------
// The app generates a fresh note every day on its own. A row published here
// overrides it for the days it covers; when none does, the app goes straight
// back to generating. Nothing here changes the generator.
const NOTE_MAX = 200;
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

function noteStatus(n) {
  const t = todayISO();
  if (!n.is_active) return { key: 'done', label: 'Stopped' };
  if (n.starts_on > t) return { key: 'scheduled', label: 'Scheduled' };
  if (n.ends_on && n.ends_on < t) return { key: 'done', label: 'Ended' };
  return { key: 'live', label: 'Live now' };
}

function viewDailyNote() {
  main.innerHTML = `
    <h1>Daily note</h1>
    <p class="lede">BODA writes a fresh note for the Home screen every day. Publish one here and
      it takes over for the days you choose &mdash; the generator keeps running underneath and
      picks straight back up when yours stops.</p>
    <div class="card note-form">
      <label for="nBody">Message</label>
      <textarea id="nBody" maxlength="${NOTE_MAX}" placeholder="Water first, then coffee. Old rule, still undefeated."></textarea>
      <p class="tiny muted" id="nCount" style="margin:6px 0 0"></p>
      <div class="when">
        <div>
          <label for="nFrom">Show from</label>
          <input type="date" id="nFrom" value="${todayISO()}" />
        </div>
        <div>
          <label for="nTo">Stop after <span class="muted" style="font-weight:400">&mdash; blank pins it</span></label>
          <input type="date" id="nTo" />
        </div>
      </div>
      <div class="toolbar" style="margin:16px 0 0">
        <button class="btn primary" id="nPublish">Publish</button>
        <span class="tiny muted" id="nMsg"></span>
      </div>
    </div>
    <h2 style="font-size:15px;margin:26px 0 4px">Published notes</h2>
    <p class="tiny muted" style="margin:0 0 10px">Only one shows in the app at a time &mdash; the newest that covers today.</p>
    <div class="card" id="noteList"><div class="spinner">Loading&hellip;</div></div>
    <p class="tiny muted" style="margin-top:14px">
      Dates are your local dates. A note reaches people the next time they open the app, not instantly.
    </p>`;

  const body = $('nBody'), count = $('nCount');
  const tick = () => {
    const n = body.value.trim().length;
    count.textContent = `${n} / ${NOTE_MAX} characters. Short lands best - the card hugs the text.`;
  };
  body.addEventListener('input', tick); tick();

  $('nPublish').onclick = publishNote;
  refreshNotes().then(drawNotes);
}

async function refreshNotes() {
  const { data, error } = await sb.from('admin_daily_notes')
    .select('*')
    .order('starts_on', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(100);
  state.notes = data ?? [];
  state.notesError = error ? error.message : null;
}

async function publishNote() {
  const btn = $('nPublish'), msg = $('nMsg');
  const text = $('nBody').value.trim();
  const from = $('nFrom').value || todayISO();
  const to   = $('nTo').value || null;

  if (!text) { msg.textContent = 'Write a message first.'; return; }
  if (text.length > NOTE_MAX) { msg.textContent = `Too long by ${text.length - NOTE_MAX}.`; return; }
  if (to && to < from) { msg.textContent = 'The stop date is before the start date.'; return; }

  btn.disabled = true; msg.textContent = 'Publishing...';
  const uid = (await sb.auth.getUser()).data.user?.id ?? null;
  const { error } = await sb.from('admin_daily_notes')
    .insert({ body: text, starts_on: from, ends_on: to, created_by: uid });
  btn.disabled = false;

  if (error) { msg.textContent = `Could not publish: ${error.message}`; return; }
  msg.textContent = 'Published.';
  $('nBody').value = ''; $('nTo').value = '';
  body_input_refresh();
  await refreshNotes(); drawNotes();
}

function body_input_refresh() {
  const el = $('nBody');
  if (el) el.dispatchEvent(new Event('input'));
}

function drawNotes() {
  const box = $('noteList');
  if (!box) return;
  if (state.notesError) { box.innerHTML = `<div class="empty">${esc(state.notesError)}</div>`; return; }
  if (!state.notes.length) {
    box.innerHTML = `<div class="empty">Nothing published. The app is writing its own note each day.</div>`;
    return;
  }
  box.innerHTML = state.notes.map(n => {
    const st = noteStatus(n);
    const when = n.starts_on === n.ends_on
      ? esc(n.starts_on)
      : `${esc(n.starts_on)} &rarr; ${esc(n.ends_on || 'until stopped')}`;
    return `<div class="note-row">
      <div class="body">
        <div style="margin-bottom:5px">${esc(n.body)}</div>
        <span class="pill ${st.key}">${st.label}</span>
        <span class="tiny muted" style="margin-left:8px">${when}</span>
      </div>
      ${n.is_active ? `<button class="btn sm danger" data-stop="${esc(n.id)}">Stop</button>` : ''}
    </div>`;
  }).join('');

  box.querySelectorAll('[data-stop]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      const { error } = await sb.from('admin_daily_notes')
        .update({ is_active: false, updated_at: new Date().toISOString() })
        .eq('id', b.dataset.stop);
      if (error) { b.disabled = false; alert(`Could not stop it: ${error.message}`); return; }
      await refreshNotes(); drawNotes();
    };
  });
}

// -- Shared: media upload + food lookup -----------------------
// Images go to the public `assets` bucket; only admins may write there (RLS).
// The public URL is stored on the row, so the app needs no signed-URL logic.

async function uploadImage(file, folder, id) {
  if (!file) return null;
  if (file.size > 5 * 1024 * 1024) throw new Error('Image must be under 5MB.');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  // Cache-bust by stamping the name: same path would otherwise serve the old image.
  const path = `${folder}/${id}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('assets')
    .upload(path, file, { upsert: true, contentType: file.type });
  if (error) throw new Error(error.message);
  return sb.storage.from('assets').getPublicUrl(path).data.publicUrl;
}

// Ingredient autocomplete runs through the same search_foods RPC the app's food
// logger uses, so what you match here is exactly what the app would find.
async function foodSearch(q) {
  const { data, error } = await sb.rpc('search_foods', { q, lim: 8, offset_n: 0 });
  if (error) return [];
  return (data ?? []).map(f => ({
    id: f.id, name: f.name, brand: f.brand, barcode: f.barcode, serving: f.serving_desc,
  }));
}

      </tr></thead>
      <tbody>${rows.map(r => {
        const mt = Array.isArray(r.meal_types) ? r.meal_types : [];
        const dt = Array.isArray(r.dietary_tags) ? r.dietary_tags : [];

          <td class="num muted">${r.protein != null ? Math.round(r.protein) : ''}</td>

function slugify(name) {
  return (name || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '').slice(0, 60) || 'recipe';
}

function ingRowHtml(i, idx) {

}

function openCatalogRecipe(id) {
  const isNew = !id;
  const r = isNew
    ? { id: '', name: '', description: '', cuisine: 'american', complexity: 'easy',
        cook_time_minutes: 20, default_servings: 2, meal_types: [], dietary_tags: [],
        ingredients: [], steps: [], calories: null, protein: null, carbs: null, fat: null,
        image_url: null, is_active: true }
    : state.catalog.find(x => x.id === id);
  if (!r) return;

  // Local working copy — nothing touches state until Save succeeds.
  let ings = (Array.isArray(r.ingredients) ? r.ingredients : []).map(x => ({ ...x }));
  let imageUrl = r.image_url ?? null;

  openDrawer(`
    <button class="btn sm" id="dClose">← Back</button>
    <h2 style="margin-top:14px">${isNew ? 'New recipe' : esc(r.name)}</h2>
    ${isNew ? '' : `<p class="tiny muted">id: ${esc(r.id)}</p>`}

    <div class="imgbox">
      <div class="prev" id="imgPrev">${imageUrl
        ? `<img src="${esc(imageUrl)}" style="width:82px;height:82px;border-radius:12px;object-fit:cover">`
        : 'no photo'}</div>
      <div>
        <input type="file" id="imgFile" accept="image/png,image/jpeg,image/webp" />
        <p class="tiny muted" style="margin:6px 0 0">JPG, PNG or WebP, under 5MB.
          Uploads when you press Save.</p>
      </div>
    </div>

    <div class="field"><label>Name</label><input id="rName" value="${esc(r.name)}" /></div>
    <div class="field"><label>Description</label>
      <textarea id="rDesc" style="min-height:56px">${esc(r.description ?? '')}</textarea></div>

    <div class="row">
      <div class="field grow"><label>Cuisine</label><select id="rCuisine">
        ${CUISINES.map(c => `<option ${c === r.cuisine ? 'selected' : ''}>${esc(c)}</option>`).join('')}
      </select></div>
      <div class="field grow"><label>Complexity</label><select id="rComplex">
        ${['easy','complex'].map(c => `<option ${c === r.complexity ? 'selected' : ''}>${esc(c)}</option>`).join('')}
      </select></div>
    </div>
    <div class="row">
      <div class="field grow"><label>Cook time (min)</label>
        <input id="rTime" type="number" min="0" value="${r.cook_time_minutes ?? ''}" /></div>
      <div class="field grow"><label>Servings</label>
        <input id="rServ" type="number" min="1" value="${r.default_servings ?? 2}" /></div>
    </div>

    <div class="field"><label>Meal types</label><div id="rMeals">
      ${MEAL_TYPES.map(m => `<label class="tiny" style="margin-right:12px">
        <input type="checkbox" value="${esc(m)}" ${(r.meal_types ?? []).includes(m) ? 'checked' : ''} /> ${esc(m)}
      </label>`).join('')}</div></div>

    <div class="field"><label>Dietary tags</label><div id="rTags">
      ${DIET_TAGS.map(t => `<label class="tiny" style="margin-right:12px">
        <input type="checkbox" value="${esc(t)}" ${(r.dietary_tags ?? []).includes(t) ? 'checked' : ''} /> ${esc(t)}
      </label>`).join('')}</div></div>

    <h3 style="font-size:14px;margin:22px 0 4px">Ingredients</h3>
    <p class="tiny muted" style="margin:0 0 8px">Type an ingredient and pick the match to attach
      its barcode. No match on file just means that food has no UPC yet — you can paste one.</p>
    <div id="ingList">${ings.map(ingRowHtml).join('')}</div>
    <button class="btn sm" id="addIng">+ Add ingredient</button>

    <div class="field" style="margin-top:20px"><label>Instructions — one step per line</label>
      <textarea id="rSteps" style="min-height:130px">${esc((Array.isArray(r.steps) ? r.steps : []).join('\n'))}</textarea></div>

    <div class="row">
      <div class="field grow"><label>Calories</label>
        <input id="rCal" type="number" value="${r.calories ?? ''}" /></div>
      <div class="field grow"><label>Protein g</label>
        <input id="rP" type="number" value="${r.protein ?? ''}" /></div>
    </div>
    <div class="row">
      <div class="field grow"><label>Carbs g</label>
        <input id="rC" type="number" value="${r.carbs ?? ''}" /></div>
      <div class="field grow"><label>Fat g</label>
        <input id="rF" type="number" value="${r.fat ?? ''}" /></div>
    </div>

    <div class="field"><label class="tiny">
      <input type="checkbox" id="rActive" ${r.is_active !== false ? 'checked' : ''} />
      Active — unticking retires it from the meal plan without deleting it
    </label></div>

    <div class="problems" id="rProblems"></div>
    <div class="actions">
      <button class="btn primary" id="rSave">${isNew ? 'Create recipe' : 'Save'}</button>
      <span class="tiny muted" id="rMsg"></span>
    </div>
  `);
  $('dClose').onclick = closeDrawer;

  // ── ingredient rows: render, autocomplete, add/remove ──
  const readRows = () => {
    [...$('ingList').querySelectorAll('.ing-row')].forEach((el, i) => {
      if (!ings[i]) return;
      ings[i].amount = el.querySelector('.i-amt').value.trim();
      ings[i].unit   = el.querySelector('.i-unit').value.trim();
      ings[i].name   = el.querySelector('.i-name').value.trim();
      ings[i].upc    = el.querySelector('.i-upc').value.trim();
    });
  };
  const renderIngs = () => { $('ingList').innerHTML = ings.map(ingRowHtml).join(''); wireIngs(); };

  let acTimer = null;
  function wireIngs() {
    $('ingList').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      readRows(); ings.splice(Number(b.dataset.del), 1); renderIngs();
    });
    $('ingList').querySelectorAll('.ing-row').forEach((el, idx) => {
      const input = el.querySelector('.i-name');
      const wrap = el.querySelector('.ing-name-wrap');
      const close = () => wrap.querySelector('.ac')?.remove();
      input.addEventListener('blur', () => setTimeout(close, 160));
      input.addEventListener('input', () => {
        clearTimeout(acTimer);
        const q = input.value.trim();
        if (q.length < 2) { close(); return; }
        acTimer = setTimeout(async () => {
          const hits = await foodSearch(q);
          close();
          if (!hits.length) return;
          const ac = document.createElement('div');
          ac.className = 'ac';
          ac.innerHTML = hits.map((h, i) => `<div data-h="${i}">
            ${esc(h.name)}${h.brand ? ` <span class="u">${esc(h.brand)}</span>` : ''}
            <span class="u">${h.barcode ? 'UPC ' + esc(h.barcode) : 'no UPC on file'}</span>
          </div>`).join('');
          wrap.appendChild(ac);
          ac.querySelectorAll('[data-h]').forEach(d => d.onclick = () => {
            const h = hits[Number(d.dataset.h)];
            readRows();
            ings[idx] = { ...ings[idx], foodId: h.id, foodName: h.name, upc: h.barcode ?? ings[idx].upc ?? '' };
            renderIngs();
          });
        }, 260);
      });
    });
  }
  wireIngs();
  $('addIng').onclick = () => { readRows(); ings.push({ amount: '', unit: '', name: '' }); renderIngs(); };

  // ── save ──
  $('rSave').onclick = async () => {
    readRows();
    const name = $('rName').value.trim();
    const steps = $('rSteps').value.split('\n').map(x => x.trim()).filter(Boolean);
    const cleanIngs = ings.filter(i => (i.name || '').trim());
    const problems = [];
    if (!name) problems.push('Name is required.');
    if (cleanIngs.length === 0) problems.push('Add at least one ingredient.');
    if (steps.length === 0) problems.push('Add at least one instruction step.');
    $('rProblems').innerHTML = problems.map(x => `• ${esc(x)}`).join('<br>');
    if (problems.length) return;

    const btn = $('rSave'), msg = $('rMsg');
    btn.disabled = true; msg.textContent = 'Saving…';

    const rowId = isNew ? `${slugify(name)}_${Math.random().toString(36).slice(2, 6)}` : r.id;
    try {
      const file = $('imgFile').files?.[0];
      if (file) { msg.textContent = 'Uploading photo…'; imageUrl = await uploadImage(file, 'recipes', rowId); }
    } catch (e) {
      btn.disabled = false; msg.textContent = `Photo failed: ${e.message}`; return;
    }

    const num = el => { const v = $(el).value.trim(); return v === '' ? null : Number(v); };
    const payload = {
      id: rowId,
      name,
      description: $('rDesc').value.trim() || null,
      cuisine: $('rCuisine').value,
      complexity: $('rComplex').value,
      cook_time_minutes: num('rTime'),
      default_servings: num('rServ') ?? 2,
      meal_types: [...$('rMeals').querySelectorAll('input:checked')].map(i => i.value),
      dietary_tags: [...$('rTags').querySelectorAll('input:checked')].map(i => i.value),
      ingredients: cleanIngs,
      steps,
      calories: num('rCal'), protein: num('rP'), carbs: num('rC'), fat: num('rF'),
      image_url: imageUrl,
      is_active: $('rActive').checked,
      updated_at: new Date().toISOString(),
    };

    const { error } = await sb.from('recipes').upsert(payload);
    btn.disabled = false;
    if (error) { msg.textContent = `Could not save: ${error.message}`; return; }

    const i = state.catalog.findIndex(x => x.id === rowId);
    if (i >= 0) state.catalog[i] = { ...state.catalog[i], ...payload };
    else state.catalog.push(payload);
    state.catalog.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    closeDrawer(); viewCatalog();
  };
}

// -- Split reviews -------------------------------------------
// Users opt in from My splits: the row carries a snapshot of the split as
// submitted plus their note. Feedback written here lands on that same row
// and shows up in the app. The submit sheet in the app already teaches the
// format (instructions + example), so expect notes in that shape.

function viewSplitReviews() {
  main.innerHTML = `
    <h1>Split reviews</h1>
    <p class="lede">Workout splits people sent in for a second pair of eyes. Read the split,
      write what you&rsquo;d keep and what you&rsquo;d change, send it back &mdash; your notes
      appear on their My splits page.</p>
    <div class="card" id="subList"><div class="spinner">Loading&hellip;</div></div>`;
  refreshSubs().then(drawSubs);
}

async function refreshSubs() {
  const { data, error } = await sb.from('workout_submissions')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(200);
  state.subs = data ?? [];
  state.subsError = error ? error.message : null;
  subsBadge();
}

function subsBadge() {
  const badge = $('cSubs');
  if (!badge) return;
  const n = state.subs.filter(x => x.status === 'pending').length;
  badge.hidden = n === 0;
  badge.textContent = n;
  groupBadges();
}

function subSplitHtml(snap) {
  const days = (snap && Array.isArray(snap.days) ? snap.days.slice() : [])
    .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
  if (!days.length) return '<div class="sub-day muted">(empty split)</div>';
  return days.map(d => {
    if (d.isRest) return `<div class="sub-day"><b>${esc(d.dayName)}</b> <span class="muted">rest</span></div>`;
    const exs = (d.exercises ?? []).map(ex => {
      const c = ex.cardio;
      let tail;
      if (c && (c.miles || c.minutes || c.incline || c.speed)) {
        tail = [
          c.miles ? `${c.miles} mi` : null,
          c.minutes ? `${c.minutes} min` : null,
          c.incline ? `${c.incline}%` : null,
          c.speed ? `${c.speed} mph` : null,
        ].filter(Boolean).join(' / ');
      } else if (c) {
        tail = 'cardio';
      } else {
        const hi = ex.repHigh != null && ex.repHigh !== ex.repLow ? '&ndash;' + ex.repHigh : '';
        tail = `${ex.targetSets}&times;${ex.repLow ?? '?'}${hi}`;
      }
      return `${esc(ex.name)} ${tail}`;
    }).join(' &middot; ');
    return `<div class="sub-day"><b>${esc(d.dayName)}</b> <span class="muted">${exs || '(no exercises)'}</span></div>`;
  }).join('');
}

function drawSubs() {
  const box = $('subList');
  if (!box) return;
  if (state.subsError) { box.innerHTML = `<div class="empty">${esc(state.subsError)}</div>`; return; }
  if (!state.subs.length) {
    box.innerHTML = `<div class="empty">Nothing submitted yet. People send splits in from My splits in the app.</div>`;
    return;
  }
  const fmt = x => x ? new Date(x).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  const rows = state.subs.slice()
    .sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1));
  box.innerHTML = rows.map(r => {
    const who = r.submitter_name || ('user ' + String(r.user_id ?? '').slice(0, 8));
    const pill = r.status === 'pending'
      ? '<span class="pill scheduled">Waiting</span>'
      : '<span class="pill done">Reviewed</span>';
    return `<div class="note-row"><div class="body">
      <div style="margin-bottom:4px"><b>${esc(r.split_name)}</b> ${pill}
        <span class="tiny muted" style="margin-left:8px">${esc(who)} &middot; ${fmt(r.created_at)}</span>
      </div>
      ${subSplitHtml(r.split_snapshot)}
      ${r.note ? `<div class="sub-note"><span class="tiny muted" style="display:block;margin-bottom:3px">THEY ASKED</span>${esc(r.note)}</div>` : ''}
      ${r.status === 'pending'
        ? `<textarea class="fb" data-fb="${esc(r.id)}" placeholder="What you'd keep, what you'd change, and why."></textarea>
           <button class="btn primary sm" data-send="${esc(r.id)}">Send feedback</button>`
        : `<div class="sub-fb"><span class="tiny muted" style="display:block;margin-bottom:3px">YOUR FEEDBACK &middot; ${fmt(r.reviewed_at)}</span>${esc(r.admin_feedback ?? '')}</div>`}
    </div></div>`;
  }).join('');

  box.querySelectorAll('[data-send]').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.send;
      const ta = box.querySelector('textarea[data-fb="' + id + '"]');
      const text = (ta && ta.value ? ta.value : '').trim();
      if (!text) { alert('Write the feedback first.'); return; }
      b.disabled = true;
      const uid = (await sb.auth.getUser()).data.user?.id ?? null;
      const { error } = await sb.from('workout_submissions')
        .update({ status: 'reviewed', admin_feedback: text, reviewed_at: new Date().toISOString(), reviewed_by: uid })
        .eq('id', id);
      if (error) { b.disabled = false; alert('Could not send: ' + error.message); return; }
      await refreshSubs(); drawSubs();
    };
  });
}

        <td style="text-align:right">
          ${u.is_admin
            ? (u.user_id === me
                ? '<span class="muted small">admin</span>'
                : `<button class="btn sm danger" data-revoke="${esc(u.user_id)}">Remove admin</button>`)
            : `<button class="btn sm" data-grant="${esc(u.user_id)}">Make admin</button>`}
        </td>
      </tr>`).join('')}
    </tbody></table>
    ${state.admins.length === 0 ? '<div class="empty">Nobody found. Try a full email address.</div>' : ''}
    <div class="err" id="aErr"></div>`;

  box.querySelectorAll('[data-grant]').forEach(b => b.onclick = () => setAdmin(b.dataset.grant, true, b));
  box.querySelectorAll('[data-revoke]').forEach(b => b.onclick = () => {
    const row = state.admins.find(u => u.user_id === b.dataset.revoke);
    if (confirm(`Remove admin access from ${row?.email}?

They will lose access to this dashboard and to other users' recipe submissions.`)) {
      setAdmin(b.dataset.revoke, false, b);
    }
  });
}

async function setAdmin(userId, makeAdmin, btn) {
  btn.disabled = true;
  const { error } = await sb.rpc('admin_set_admin', { p_user_id: userId, p_is_admin: makeAdmin });
  if (error) {
    const err = $('aErr');
    if (err) err.textContent = error.message;
    btn.disabled = false;
    return;
  }
  await refreshAdmins(adminSearch);
  drawAdmins();
}

// ── Drawer ──────────────────────────────────────────────────
function openDrawer(html) {
  $('drawer').innerHTML = html;
  $('drawer').style.display = 'block';
  $('drawerBg').style.display = 'block';
}
function closeDrawer() {
  $('drawer').style.display = 'none';
  $('drawerBg').style.display = 'none';
}
$('drawerBg').onclick = closeDrawer;

function openRecipe(id) {
  const r = state.recipes.find(x => x.id === id);
  if (!r) return;
  const ing = Array.isArray(r.ingredients) ? r.ingredients : [];
  openDrawer(`
    <button class="btn sm" id="dClose">← Back</button>
    <h2 style="margin-top:14px">${esc(r.title || 'Untitled import')}</h2>
    <p class="small muted">${esc([r.source_platform, r.source_author].filter(Boolean).join(' · '))}</p>
    <p class="tiny"><a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.source_url)}</a></p>
    <div class="card">
      <b>${r.calories ?? 0} cal</b> · ${Math.round(r.protein_grams ?? 0)}g P ·
      ${Math.round(r.carbs_grams ?? 0)}g C · ${Math.round(r.fat_grams ?? 0)}g F
      <div class="tiny muted" style="margin-top:4px">
        Per serving${r.servings > 1 ? ` (makes ${r.servings})` : ''} — summed from the
        ingredients below, not from the caption.
      </div>
    </div>
    <p class="small"><b>Ingredients</b> (${ing.length})</p>
    ${ing.map(i => `<div class="ing ${i.matchedFoodId ? '' : 'miss'}">
      ${esc([i.quantity, i.unit, i.name].filter(Boolean).join(' '))}
      ${i.matchedFoodId ? `<span class="muted"> — ${i.calories ?? 0} cal</span>`
        : '<span class="muted"> — no database match, not counted</span>'}
    </div>`).join('')}
    ${(r.instructions||[]).length ? `<p class="small" style="margin-top:16px"><b>Method</b></p>
      <ol class="small">${r.instructions.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
    ${(r.equipment||[]).length ? `<p class="small"><b>Equipment:</b>
      ${esc(r.equipment.join(', '))}</p>` : ''}
    <p class="tiny muted">Submitted by ${esc(String(r.user_id).slice(0,8))}…</p>
    <div class="actions">
      ${r.status !== 'approved' ? `<button class="btn coral" id="approve">Approve into the menu</button>` : ''}
      ${r.status !== 'rejected' ? `<button class="btn danger" id="reject">Reject</button>` : ''}
    </div>
    <div class="err" id="rErr"></div>
  `);
  $('dClose').onclick = closeDrawer;
  const approve = $('approve'), reject = $('reject');
  if (approve) approve.onclick = async () => {
    approve.disabled = true;
    const { error } = await sb.rpc('approve_social_recipe', { p_id: r.id });
    if (error) { $('rErr').textContent = error.message; approve.disabled = false; return; }
    closeDrawer(); await loadAll();
  };
  if (reject) reject.onclick = async () => {
    reject.disabled = true;
    const { error } = await sb.from('social_recipes')
      .update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', r.id);
    if (error) { $('rErr').textContent = error.message; reject.disabled = false; return; }
    closeDrawer(); await loadAll();
  };
}

function openExercise(id) {
  const isNew = !id;
  const e = isNew
    ? { id: '', name: '', primary_muscles: [], secondary_muscles: [], equipment: [],
        movement_pattern: '', difficulty: 3, default_rest_sec: 90, how_to: [], tips: [],
        safety: '', is_home_ready: false, is_active: true, image_url: null, video_url: null }
    : state.exercises.find(x => x.id === id);
  if (!e) return;

  let imageUrl = e.image_url ?? null;
  const csv = a => (Array.isArray(a) ? a : []).join(', ');

  openDrawer(`
    <button class="btn sm" id="dClose">← Back</button>
    <h2 style="margin-top:14px">${isNew ? 'New exercise' : esc(e.name)}</h2>
    ${isNew ? '' : `<p class="tiny muted">id: ${esc(e.id)}</p>`}

    <div class="imgbox">
      <div class="prev" id="exPrev">${imageUrl
        ? `<img src="${esc(imageUrl)}" style="width:82px;height:82px;border-radius:12px;object-fit:cover">`
        : 'no photo'}</div>
      <div>
        <input type="file" id="exFile" accept="image/png,image/jpeg,image/webp" />
        <p class="tiny muted" style="margin:6px 0 0">JPG, PNG or WebP, under 5MB.
          Uploads when you press Save.</p>
      </div>
    </div>

    <div class="field"><label>Video link
        <span class="muted" style="font-weight:400">— stored only, nothing plays it yet</span></label>
      <input id="exVideo" value="${esc(e.video_url || '')}" placeholder="https://…" /></div>

    <div class="field"><label>Name</label><input id="eName" value="${esc(e.name)}" /></div>

    <div class="row">
      <div class="field grow"><label>Primary muscles — comma separated</label>
        <input id="eMus" value="${esc(csv(e.primary_muscles))}" placeholder="chest, triceps" /></div>
      <div class="field grow"><label>Secondary muscles</label>
        <input id="eMus2" value="${esc(csv(e.secondary_muscles))}" placeholder="shoulders" /></div>
    </div>
    <div class="row">
      <div class="field grow"><label>Equipment — comma separated</label>
        <input id="eEquip" value="${esc(csv(e.equipment))}" placeholder="barbell, bench" /></div>
      <div class="field grow"><label>Movement pattern</label>
        <input id="ePat" list="patterns" value="${esc(e.movement_pattern || '')}" placeholder="push" />
        <datalist id="patterns">
          ${['push','pull','squat','hinge','lunge','carry','core','isolation','cardio']
            .map(x => `<option value="${x}">`).join('')}
        </datalist></div>
    </div>

    <div class="field"><label>Steps — one per line, 2 to 4</label>
      <textarea id="eHow">${esc((e.how_to || []).join('\n'))}</textarea></div>
    <div class="field"><label>Tips — one per line, 1 to 3</label>
      <textarea id="eTips">${esc((e.tips || []).join('\n'))}</textarea></div>
    <div class="field"><label>Safety — optional, one line</label>
      <textarea id="eSafety" style="min-height:60px">${esc(e.safety || '')}</textarea></div>

    <div class="row">
      <div class="field grow"><label>Difficulty 1–5</label>
        <input id="eDiff" type="number" min="1" max="5" value="${e.difficulty ?? 3}" /></div>
      <div class="field grow"><label>Rest (seconds)</label>
        <input id="eRest" type="number" value="${e.default_rest_sec ?? 90}" /></div>
    </div>

    <div class="field"><label class="tiny">
      <input type="checkbox" id="eHome" ${e.is_home_ready ? 'checked' : ''} />
      Can be done at home — no gym machine needed
    </label></div>
    <div class="field"><label class="tiny">
      <input type="checkbox" id="eActive" ${e.is_active !== false ? 'checked' : ''} />
      Active — unticking retires it without deleting it
    </label></div>

    <div class="problems" id="eProblems"></div>
    <div class="actions">
      <button class="btn primary" id="eSave">${isNew ? 'Create exercise' : 'Save'}</button>
      <span class="tiny muted" id="eMsg"></span>
    </div>
  `);
  $('dClose').onclick = closeDrawer;

  const validate = () => {
    const how = $('eHow').value.split('\n').map(x => x.trim()).filter(Boolean);
    const tips = $('eTips').value.split('\n').map(x => x.trim()).filter(Boolean);
    const d = Number($('eDiff').value);
    const p = [];
    if (!$('eName').value.trim()) p.push('Name is required.');
    if (how.length < 2 || how.length > 4) p.push('Steps must be 2 to 4 lines.');
    if (how.some(l => l.length > 130)) p.push('Each step must be under 130 characters.');
    if (tips.length < 1 || tips.length > 3) p.push('Tips must be 1 to 3 lines.');
    if (tips.some(l => l.length > 120)) p.push('Each tip must be under 120 characters.');
    if (!(d >= 1 && d <= 5)) p.push('Difficulty must be 1 to 5.');
    $('eProblems').innerHTML = p.map(x => `• ${esc(x)}`).join('<br>');
    $('eSave').disabled = p.length > 0;
    return { how, tips, d, ok: p.length === 0 };
  };
  ['eHow','eTips','eDiff','eName'].forEach(i => $(i).addEventListener('input', validate));
  validate();

  $('eSave').onclick = async () => {
    const v = validate();
    if (!v.ok) return;
    const btn = $('eSave'), msg = $('eMsg');
    btn.disabled = true; msg.textContent = 'Saving…';

    const name = $('eName').value.trim();
    const rowId = isNew ? slugify(name) : e.id;
    try {
      const file = $('exFile').files?.[0];
      if (file) { msg.textContent = 'Uploading photo…'; imageUrl = await uploadImage(file, 'exercises', rowId); }
    } catch (err) {
      btn.disabled = false; msg.textContent = `Photo failed: ${err.message}`; return;
    }

    const list = el => $(el).value.split(',').map(x => x.trim()).filter(Boolean);
    const payload = {
      id: rowId,
      name,
      primary_muscles: list('eMus'),
      secondary_muscles: list('eMus2'),
      equipment: list('eEquip'),
      movement_pattern: $('ePat').value.trim() || null,
      how_to: v.how, tips: v.tips,
      safety: $('eSafety').value.trim() || null,
      difficulty: v.d,
      default_rest_sec: Number($('eRest').value) || 90,
      is_home_ready: $('eHome').checked,
      is_active: $('eActive').checked,
      image_url: imageUrl,
      video_url: $('exVideo').value.trim() || null,
      updated_at: new Date().toISOString(),
    };

    // The database re-checks its own integrity rules, so a change that would
    // break the library gets refused here rather than silently accepted.
    const { error } = await sb.from('exercises').upsert(payload);
    btn.disabled = false;
    if (error) { $('eProblems').textContent = 'Rejected by the server: ' + error.message; return; }
    closeDrawer(); await loadAll();
  };
}

// ── Boot ────────────────────────────────────────────────────
sb.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A workout shared with BODA</title>
<meta property="og:title" content="A workout was shared with you">
<meta property="og:description" content="Open it in BODA to train it — food, training and recovery in one honest place.">
<meta property="og:site_name" content="BODA Nutrition">
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--cream:#FEFEF2;--navy:#000031;--coral:#FF6F63;--coralink:#993C1D;--peach:#FDEBE1;
    --muted:#5C5C74;--line:rgba(0,0,49,.10)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--cream);
    font:16px/1.55 Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;padding:34px 18px 60px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:26px}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--coral);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
  .brand b{font-size:15px;letter-spacing:.2px}
  .tag{font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;
    color:rgba(254,254,242,.55);margin:0 0 8px}
  .hero{background:var(--cream);color:var(--navy);border-radius:18px;padding:20px;margin-bottom:12px}
  .hero h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .hero .by{margin:4px 0 0;font-size:13.5px;font-weight:600;color:var(--coralink)}
  .day{background:var(--cream);color:var(--navy);border-radius:16px;padding:15px 16px;margin-bottom:10px}
  .day h2{margin:0 0 7px;font-size:14.5px;font-weight:600}
  .rest{font-size:12.5px;color:var(--muted)}
  .ex{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13.5px}
  .ex .m{color:var(--muted);font-weight:500;white-space:nowrap;font-size:12.5px}
  .cta{display:block;text-align:center;border-radius:14px;padding:15px;margin-top:14px;
    font-weight:600;font-size:15px;text-decoration:none}
  .cta.app{background:var(--coral);color:#fff}
  .cta.store{background:rgba(254,254,242,.12);color:var(--cream);border:1px solid rgba(254,254,242,.22)}
  .fine{font-size:12px;color:rgba(254,254,242,.55);text-align:center;margin-top:14px;line-height:1.6}
  .state{padding:60px 10px;text-align:center;color:rgba(254,254,242,.65);font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="dot">B</div><b>BODA Nutrition</b></div>
  <p class="tag">Shared workout</p>
  <div id="content"><div class="state">Opening the workout&hellip;</div></div>
</div>

<script>
// Static page on GitHub Pages: the code rides the query string and the split
// is fetched client-side through the anon-safe get_shared_split RPC (exact
// code or nothing — rows are not enumerable). The anon key is publishable;
// RLS guards everything, same posture as /admin.
const SUPABASE_URL = 'https://blrbirygfkflyehjupry.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJscmJpcnlnZmtmbHllaGp1cHJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjM0OTIsImV4cCI6MjA5Mzc5OTQ5Mn0.7Un2ofLMs3BbNm9HRo5cnaAj0iAjH6pp1G4VBBmh2Gc';
const APP_STORE = 'https://apps.apple.com/app/id6805162944';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const box = document.getElementById('content');

function exMeta(ex) {
  const c = ex.cardio;
  if (c && (c.miles || c.minutes || c.incline || c.speed)) {
    return [
      c.miles ? c.miles + ' mi' : null,
      c.minutes ? c.minutes + ' min' : null,
      c.incline ? c.incline + '%' : null,
      c.speed ? c.speed + ' mph' : null,
    ].filter(Boolean).join(' · ');
  }
  if (c) return 'cardio';
  const hi = ex.repHigh != null && ex.repHigh !== ex.repLow ? '–' + ex.repHigh : '';
  return ex.targetSets + ' × ' + (ex.repLow ?? '?') + hi;
}

function dead() {
  box.innerHTML = '<div class="state">This link isn’t live any more — whoever shared it may have taken it down.<br><br>' +
    '<a class="cta store" style="display:inline-block;padding:12px 22px" href="' + APP_STORE + '">Get BODA on the App Store</a></div>';
}

async function run() {
  const code = new URLSearchParams(location.search).get('c');
  if (!code) { dead(); return; }
  let row = null;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_shared_split', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON,
        Authorization: 'Bearer ' + SUPABASE_ANON,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_code: code }),
    });
    if (res.ok) row = await res.json();
  } catch {}
  if (!row || !row.split_snapshot || !Array.isArray(row.split_snapshot.days)) { dead(); return; }

  const days = row.split_snapshot.days.slice()
    .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
  const dayHtml = days.map(d => {
    if (d.isRest) return '<div class="day"><h2>' + esc(d.dayName) + '</h2><div class="rest">Rest day</div></div>';
    const exs = (d.exercises ?? []).slice()
      .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0))
      .map(ex => '<div class="ex"><span>' + esc(ex.name) + '</span><span class="m">' + esc(exMeta(ex)) + '</span></div>')
      .join('');
    return '<div class="day"><h2>' + esc(d.dayName) + '</h2>' + (exs || '<div class="rest">No exercises</div>') + '</div>';
  }).join('');

  box.innerHTML =
    '<div class="hero"><h1>' + esc(row.split_name) + '</h1>' +
    (row.made_by ? '<p class="by">Made by ' + esc(row.made_by) + '</p>' : '') +
    '</div>' +
    dayHtml +
    '<a class="cta app" href="boda://share/' + esc(row.code) + '">Open in BODA</a>' +
    '<a class="cta store" href="' + APP_STORE + '">Get BODA on the App Store</a>' +
    '<p class="fine">Have the app? “Open in BODA” drops this straight into My splits.<br>' +
    'BODA is food, training and recovery in one honest place.</p>';

  document.title = esc(row.split_name) + ' — BODA workout';
}
run();
</script>
</body>
</html>
